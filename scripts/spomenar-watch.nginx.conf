# Include in the existing HTTPS server. These routes serve static files.
# Keep the publication catalog outside the replaceable viewer site.
# The supervisor opens/closes one root-owned public -> catalog symlink. Disable
# open-file caching so its next authorization poll can close every route below.
# The atlas store currently lives below the server's document root. Its direct
# storage URL must remain inaccessible when the public link is removed.
location = /spomenar-previews { return 404; }
location ^~ /spomenar-previews/ { return 404; }

location = /spomenar/config.json {
    alias /mnt/btrfs_storage/spomenar-public/public/config.json;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    # Atomic JSON changes can have equal length within nginx's one-second mtime
    # resolution. Always return this small body; clients compare its revision.
    etag off;
    if_modified_since off;
    open_file_cache off;
}

location = /spomenar/status.json {
    alias /mnt/btrfs_storage/spomenar-public/public/status.json;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    etag off;
    if_modified_since off;
    open_file_cache off;
}

location ^~ /spomenar-versions/ {
    alias /mnt/btrfs_storage/spomenar-public/public/versions/;
    default_type application/pdf;
    autoindex off;
    sendfile on;
    gzip off;
    etag on;
    max_ranges 1;
    add_header Cache-Control "no-cache" always;
    open_file_cache off;
}

location ^~ /spomenar/previews/ {
    alias /mnt/btrfs_storage/spomenar-public/public/previews/;
    autoindex off;
    gzip off;
    etag on;
    add_header Cache-Control "no-cache" always;
    open_file_cache off;
}
