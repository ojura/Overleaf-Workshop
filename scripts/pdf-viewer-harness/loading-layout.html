<!doctype html>
<meta charset="utf-8">
<title>Loading layout regression</title>
<style>
html,body { margin:0; height:100%; font-family:system-ui,sans-serif; background:#ddd }
#stage { position:relative; width:100%; height:100%; overflow:auto }
.pages { display:flex; gap:16px; padding:40px 24px; justify-content:center }
.page { width:42vw; max-width:560px; height:760px; flex-shrink:0; background:white }
@media(max-width:600px) { .pages { flex-direction:column } .page { width:100%; max-width:none } }
</style>
<div id="stage"><div class="pages"><div class="page"></div><div class="page"></div></div></div>
<script type="module" src="/ext/loading-layout.js"></script>
